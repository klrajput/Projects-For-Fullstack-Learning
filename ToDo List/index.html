<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My ToDo List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">


        <!-- Application Header -->
        <h1>Your Tasks</h1>
        <p>Organise Your Day, One Task at a Time</p>

         <!-- Task Statistics -->
        <div class="stats">

            <div class="stat-box">
                <h3 id="totalTasks">0</h3>
                <p>Total Tasks</p>
            </div>

            <div class="stat-box">
                <h3 id="completedTasks">0</h3>
                <p>Completed</p>
            </div>

        </div>


        <!-- Task-Input-Section -->
        <div class="input-section">

            <!-- Input-1 : Input Field -->
            <input type="text" id="taskInput" placeholder="Enter the task...">

            <!-- Input-2 : Add Button -->
             <button id="addBtn" type="button">Add Task</button>

            
        </div>


        <!-- Task-List-Section -->
        <div class="task-section">

            <h2>Your Tasks</h2>

            <!-- Tasks-List-Display -->
            <ul id="tasklist">

            </ul>

            <!-- Empty-List-Message -->
            <p id="emptyMessage">No Task Yet.</p>

        </div>

    </div>
    

    <script src="script.js"></script>
</body>
</html>
